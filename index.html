<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evolução do Projeto</title>

  <!-- Tailwind CSS & Ícones -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col justify-between items-center p-3 md:p-6 relative overflow-hidden bg-black">

  <!-- TELA DE APRESENTAÇÃO INICIAL -->
  <div id="welcomeScreen" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-black text-white text-center p-6 transition-opacity duration-700">
    <div class="max-w-xl bg-black/80 p-8 rounded-lg border border-white/10 shadow-2xl flex flex-col items-center gap-6">
      
      <h1 class="text-4xl md:text-6xl font-black tracking-tight text-white leading-tight">
        Vamos navegar no tempo?
      </h1>
      
      <p class="text-base md:text-lg text-slate-300 font-medium">
        Substituição dos trabalhos humanos
      </p>

      <button id="btnEnter" class="mt-2 px-9 py-4 bg-black hover:bg-slate-900 text-white font-black text-base uppercase tracking-wider rounded border border-white/30 shadow-lg transition-all duration-300 transform hover:scale-105 active:scale-95 flex items-center gap-3">
        <span>Entrar</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </div>
  </div>

  <!-- Plano de Fundo Dinâmico -->
  <div id="bgTimeline" class="bg-timeline-image"></div>
  <div class="bg-overlay"></div>

  <!-- TÍTULO PRINCIPAL BEM MAIOR NO TOPO -->
  <header class="z-10 text-center mt-2 mb-3 header-content px-4">
    <h1 id="epochTitle" class="text-3xl md:text-5xl font-black text-white drop-shadow-lg tracking-tight leading-tight">
      <!-- O título dinâmico da época ativa aparecerá aqui -->
    </h1>
  </header>

  <!-- Carrossel 3D Principal -->
  <main class="w-full max-w-7xl scene-3d my-auto relative z-10 main-content flex items-center justify-center">
    <div id="carouselStage" class="carousel-stage"></div>
  </main>

  <!-- RODAPÉ MINIMALISTA -->
  <footer class="z-10 flex flex-col items-center mb-1 footer-content">
    <div class="flex items-center gap-2 bg-black/70 border border-white/15 px-4 py-1.5 rounded-full text-xs font-semibold text-slate-200 shadow-xl">
      <span>Navegar:</span>
      <kbd class="px-2 py-0.5 bg-white/10 rounded border border-white/20 text-white font-mono text-[10px]">←</kbd>
      <kbd class="px-2 py-0.5 bg-white/10 rounded border border-white/20 text-white font-mono text-[10px]">→</kbd>
    </div>
  </footer>

  <script>
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let callInterval = null;
    let cameraStream = null;

    let bankBalance = 2450.80;
    let isBalanceVisible = true;

    function getAudioCtx() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playTypewriterKeySound() {
      try {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(320 + Math.random() * 120, now);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.04);
      } catch (e) {}
    }

    function playTypewriterBellSound() {
      try {
        const ctx = getAudioCtx();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(1580, now);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      } catch (e) {}
    }

    function playWhatsAppRingSound() {
      try {
        const ctx = getAudioCtx();
        const osc1 = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        const gain = ctx.createGain();
        osc1.type = 'sine';
        osc2.type = 'sine';
        osc1.frequency.setValueAtTime(425, ctx.currentTime);
        osc2.frequency.setValueAtTime(450, ctx.currentTime);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.8);
        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(ctx.destination);
        osc1.start();
        osc2.start();
        osc1.stop(ctx.currentTime + 0.8);
        osc2.stop(ctx.currentTime + 0.8);
      } catch (e) {}
    }

    function playWhatsAppConnectSound() {
      try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.15);
      } catch (e) {}
    }

    function startWhatsAppCall(name, phrase, avatarIcon, langCode) {
      endPhoneCall();
      const callOverlay = document.getElementById('whatsappCallOverlay');
      const nameElem = document.getElementById('whatsappContactName');
      const statusElem = document.getElementById('whatsappCallStatus');
      const textElem = document.getElementById('whatsappSpeechText');
      const avatarElem = document.getElementById('whatsappAvatarIcon');

      if (!callOverlay) return;

      callOverlay.classList.remove('hidden');
      nameElem.textContent = name;
      statusElem.textContent = "Chamando...";
      textElem.textContent = "";
      avatarElem.className = `fa-solid ${avatarIcon} text-2xl text-emerald-400`;

      playWhatsAppRingSound();
      callInterval = setInterval(() => { playWhatsAppRingSound(); }, 1800);

      setTimeout(() => {
        clearInterval(callInterval);
        playWhatsAppConnectSound();
        statusElem.textContent = "00:06";
        textElem.textContent = `"${phrase}"`;

        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(phrase);
          utterance.lang = langCode || 'pt-BR';
          utterance.rate = 0.95;
          utterance.pitch = name === 'Shakira' ? 1.25 : 0.85;
          window.speechSynthesis.speak(utterance);
        }
      }, 2500);
    }

    function endPhoneCall() {
      if (callInterval) clearInterval(callInterval);
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      const callOverlay = document.getElementById('whatsappCallOverlay');
      if (callOverlay) callOverlay.classList.add('hidden');
    }

    function executeMiniSearch() {
      const input = document.getElementById('googleSearchInput');
      const results = document.getElementById('googleSearchResults');
      if (!input || !results) return;
      const query = input.value.trim();
      if (!query) return;

      results.innerHTML = `
        <div class="text-[10px] text-blue-600 font-bold underline cursor-pointer truncate">
          ${query} - A Revolução da Internet
        </div>
        <div class="text-[9px] text-slate-600 leading-tight mt-0.5">
          Conectando o mundo e automatizando o acesso à informação global.
        </div>
      `;
    }

    function switchSmartphoneApp(appName) {
      const youtubeApp = document.getElementById('appYoutube');
      const cameraApp = document.getElementById('appCamera');
      const mlApp = document.getElementById('appMercadoLivre');

      if (youtubeApp) youtubeApp.classList.add('hidden');
      if (cameraApp) cameraApp.classList.add('hidden');
      if (mlApp) mlApp.classList.add('hidden');

      stopCameraStream();

      if (appName === 'youtube' && youtubeApp) youtubeApp.classList.remove('hidden');
      if (appName === 'camera' && cameraApp) {
        cameraApp.classList.remove('hidden');
        confirmAndStartCamera();
      }
      if (appName === 'ml' && mlApp) mlApp.classList.remove('hidden');
    }

    function confirmAndStartCamera() {
      if (confirm("Deseja ativar a câmera do dispositivo?")) {
        const video = document.getElementById('smartphoneCameraFeed');
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          navigator.mediaDevices.getUserMedia({ video: true })
            .then((stream) => {
              cameraStream = stream;
              if (video) { video.srcObject = stream; video.play(); }
            })
            .catch(() => { alert("Não foi possível acessar a câmera."); });
        } else {
          alert("Navegador sem suporte para câmera.");
        }
      }
    }

    function stopCameraStream() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
    }

    function confirmAndOpenMaps() {
      if (confirm("Deseja abrir o Google Maps em uma nova aba?")) {
        window.open('https://maps.google.com', '_blank');
      }
    }

    function toggleBalanceVisibility() {
      isBalanceVisible = !isBalanceVisible;
      const display = document.getElementById('bankBalanceDisplay');
      const eyeIcon = document.getElementById('bankEyeIcon');

      if (display && eyeIcon) {
        if (isBalanceVisible) {
          display.textContent = `R$ ${bankBalance.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
          eyeIcon.className = 'fa-solid fa-eye text-white text-xs';
        } else {
          display.textContent = 'R$ ••••••';
          eyeIcon.className = 'fa-solid fa-eye-slash text-white text-xs';
        }
      }
    }

    function sendPixTransfer() {
      const amount = prompt("Digite o valor da transferência Pix (R$):", "50.00");
      if (amount && !isNaN(parseFloat(amount))) {
        const val = parseFloat(amount);
        if (val <= bankBalance) {
          bankBalance -= val;
          toggleBalanceVisibility();
          isBalanceVisible = !isBalanceVisible;
          toggleBalanceVisibility();
          alert(`Pix de R$ ${val.toFixed(2)} enviado com sucesso!`);
        } else {
          alert("Saldo insuficiente!");
        }
      }
    }

    const blocksData = [
      {
        num: "01",
        title: "Acendedores automáticos de lampiões",
        periodo: "Século XIX",
        desc: "Reduziram o trabalho de acender lampiões manualmente.",
        imagem: "img/imagem1.jpg",
        bgPosition: "75% center",
        youtubeUrl: "https://www.youtube.com/watch?v=ek-K9k849cU&t=148s",
        isWoodStyle: true,
        hasVintageSwitch: true
      },
      {
        num: "02",
        title: "Máquina de escrever",
        periodo: "Década de 1870",
        desc: "Transformou a produção de documentos e o trabalho dos datilógrafos.",
        imagem: "img/imagem2.png",
        bgPosition: "center center",
        youtubeUrl: "https://www.youtube.com/watch?v=XH2rRtpzD08",
        hasTypewriter: true
      },
      {
        num: "03",
        title: "Telefone",
        periodo: "1876",
        desc: "Reduziu a dependência de cartas para comunicações rápidas.",
        imagem: "img/imagem3.jpg",
        bgPosition: "center center",
        youtubeUrl: "https://www.youtube.com/watch?v=jfaI1dUu9tw",
        hasWhatsAppCalls: true
      },
      {
        num: "04",
        title: "Internet",
        periodo: "Décadas de 1980–1990",
        desc: "Transformou o acesso a informações e comunicação.",
        imagem: "img/imagem4.jpg",
        bgPosition: "center center",
        youtubeUrl: "https://www.youtube.com/watch?v=W4wnz-5vAoE&t=14s",
        hasGoogleSearch: true
      },
      {
        num: "05",
        title: "Celular",
        periodo: "Década de 1980",
        desc: "Reuniu diversas ferramentas essenciais em um só aparelho.",
        imagem: "img/imagem5.jpg",
        bgPosition: "center center",
        youtubeUrl: "https://www.youtube.com/watch?v=PeCZU6Y3eIU",
        hasSmartphone: true
      },
      {
        num: "06",
        title: "Bancos online",
        periodo: "Décadas de 1990–2000",
        desc: "Permitem operações financeiras sem ir à agência.",
        imagem: "img/imagem6.jpg",
        bgPosition: "center center",
        youtubeUrl: "https://www.youtube.com/watch?v=ctDs3Hsi-3w",
        hasOnlineBank: true
      },
      {
        num: "07",
        title: "Inteligência Artificial (IA)",
        periodo: "Expansão na década de 2020",
        desc: "Automatiza tarefas complexas e geração de conteúdo.",
        imagem: "img/imagem7.jpg",
        bgPosition: "center center",
        youtubeUrl: "https://www.youtube.com/watch?v=UXew3u3fOe4",
        hasAiSymbols: true
      }
    ];

    let currentIndex = 0;
    let hideTimer = null;
    let isLightOnPermanently = false;
    const totalCards = blocksData.length;
    const stage = document.getElementById('carouselStage');
    const bgTimeline = document.getElementById('bgTimeline');
    const epochTitle = document.getElementById('epochTitle');

    const welcomeScreen = document.getElementById('welcomeScreen');
    const btnEnter = document.getElementById('btnEnter');

    btnEnter.addEventListener('click', () => {
      welcomeScreen.style.opacity = '0';
      setTimeout(() => { welcomeScreen.style.display = 'none'; }, 700);
    });

    function toggleVintageLamp() {
      isLightOnPermanently = !isLightOnPermanently;
      if (isLightOnPermanently) {
        document.body.classList.add('lamp-on');
      } else {
        document.body.classList.remove('lamp-on');
      }
    }

    function renderCards() {
      stage.innerHTML = '';

      blocksData.forEach((block, index) => {
        const card = document.createElement('div');
        
        let cardClasses = `carousel-card ${index === currentIndex ? 'active-card' : ''}`;
        if (block.isWoodStyle) cardClasses += ' wood-theme-card';
        if (block.hasTypewriter) cardClasses += ' typewriter-card';
        if (block.hasSmartphone) cardClasses += ' smartphone-card';
        card.className = cardClasses;

        let switchHTML = block.hasVintageSwitch ? `
          <button onclick="event.stopPropagation(); toggleVintageLamp();" class="btn-vintage-switch" title="Acender / Apagar Luz">
            <i class="fa-solid fa-power-off text-lg md:text-xl"></i>
          </button>
        ` : '';

        let typewriterHTML = block.hasTypewriter ? `
          <div class="typewriter-paper-container w-full my-auto" onclick="event.stopPropagation();">
            <div class="typewriter-paper">
              <textarea 
                class="typewriter-input" 
                placeholder="Digite aqui como em 1870..." 
                rows="3"
                oninput="playTypewriterKeySound();"
                onkeydown="if(event.key==='Enter') playTypewriterBellSound();"
              ></textarea>
            </div>
          </div>
        ` : '';

        let whatsAppHTML = block.hasWhatsAppCalls ? `
          <div class="whatsapp-calls-container w-full my-auto flex flex-col gap-1.5" onclick="event.stopPropagation();">
            <div class="flex items-center justify-center gap-1 text-emerald-600 font-black text-xs uppercase tracking-wider">
              <i class="fa-brands fa-whatsapp text-sm"></i>
              <span>Chamada de Voz</span>
            </div>
            
            <div class="flex gap-1.5">
              <button onclick="startWhatsAppCall('Cristiano Ronaldo', 'SIIIIUUU! A dedicação vence tudo!', 'fa-user-ninja', 'pt-PT')" class="btn-wa-call flex-1 py-1.5 px-2 bg-emerald-600 hover:bg-emerald-700 text-white font-black text-[10px] rounded flex items-center justify-center gap-1 shadow transition-all">
                <i class="fa-solid fa-phone text-[9px]"></i>
                <span>CR7</span>
              </button>
              
              <button onclick="startWhatsAppCall('Shakira', 'Hola mi amor! A comunicação conecta o mundo!', 'fa-music', 'es-ES')" class="btn-wa-call flex-1 py-1.5 px-2 bg-emerald-600 hover:bg-emerald-700 text-white font-black text-[10px] rounded flex items-center justify-center gap-1 shadow transition-all">
                <i class="fa-solid fa-phone text-[9px]"></i>
                <span>Shakira</span>
              </button>
            </div>

            <div id="whatsappCallOverlay" class="hidden p-2 bg-[#0b141a] text-white rounded-lg border border-emerald-500/30 text-center shadow-xl">
              <div class="w-8 h-8 rounded-full bg-slate-800 border border-emerald-500/50 flex items-center justify-center mx-auto mb-0.5">
                <i id="whatsappAvatarIcon" class="fa-solid fa-user text-emerald-400 text-base"></i>
              </div>
              <div id="whatsappContactName" class="text-xs font-bold text-slate-100"></div>
              <div id="whatsappCallStatus" class="text-[9px] text-emerald-400 font-medium">Chamando...</div>
              <div id="whatsappSpeechText" class="text-[10px] italic text-amber-200 mt-0.5 font-serif min-h-[18px]"></div>

              <button onclick="endPhoneCall();" class="mt-1 w-6 h-6 rounded-full bg-red-600 hover:bg-red-700 text-white flex items-center justify-center mx-auto shadow transition-all">
                <i class="fa-solid fa-phone-slash text-[8px]"></i>
              </button>
            </div>
          </div>
        ` : '';

        let googleSearchHTML = block.hasGoogleSearch ? `
          <div class="google-search-container w-full my-auto flex flex-col gap-1.5 p-2 bg-slate-100 rounded border border-slate-300" onclick="event.stopPropagation();">
            <div class="flex items-center justify-center gap-0.5 text-sm font-black">
              <span class="text-blue-500">G</span><span class="text-red-500">o</span><span class="text-yellow-500">o</span><span class="text-blue-500">g</span><span class="text-green-500">l</span><span class="text-red-500">e</span>
            </div>

            <div class="flex gap-1">
              <input 
                id="googleSearchInput" 
                type="text" 
                placeholder="Pesquisar..." 
                class="w-full px-2 py-1 text-[10px] border border-slate-300 rounded outline-none focus:border-blue-500 bg-white"
                onkeydown="if(event.key==='Enter') executeMiniSearch();"
              >
              <button onclick="executeMiniSearch();" class="px-2 py-1 bg-blue-600 hover:bg-blue-700 text-white rounded text-[10px] font-bold">
                <i class="fa-solid fa-magnifying-glass"></i>
              </button>
            </div>

            <div id="googleSearchResults" class="bg-white p-1.5 rounded border border-slate-200 min-h-[32px] flex flex-col justify-center">
              <span class="text-[9px] text-slate-400 italic text-center">Digite algo...</span>
            </div>
          </div>
        ` : '';

        let smartphoneHTML = block.hasSmartphone ? `
          <div class="smartphone-frame w-full h-full flex flex-col justify-between bg-black text-white p-2 rounded-xl border border-slate-700 shadow-2xl relative overflow-hidden" onclick="event.stopPropagation();">
            <div class="flex items-center justify-between text-[8px] font-bold text-slate-300 px-1 pt-0.5 pb-0.5 border-b border-slate-800">
              <span>09:41</span>
              <div class="w-6 h-1 bg-slate-800 rounded-full"></div>
              <div class="flex items-center gap-0.5">
                <i class="fa-solid fa-wifi text-[7px]"></i>
                <i class="fa-solid fa-battery-full text-[7px]"></i>
              </div>
            </div>

            <div class="flex-1 my-1 relative overflow-hidden rounded bg-slate-950 flex flex-col justify-center">
              <div id="appYoutube" class="w-full h-full flex flex-col justify-center items-center p-1 bg-zinc-900">
                <div class="flex items-center gap-1 mb-1 text-red-500 font-black text-xs">
                  <i class="fa-brands fa-youtube text-sm"></i>
                  <span class="text-white font-bold">YouTube</span>
                </div>
                <a href="${block.youtubeUrl}" target="_blank" rel="noopener noreferrer" class="w-full py-1.5 bg-red-600 hover:bg-red-700 text-white font-extrabold text-[10px] rounded flex items-center justify-center gap-1 shadow transition-all">
                  <i class="fa-solid fa-play text-[8px]"></i>
                  <span>Abrir Vídeo</span>
                </a>
              </div>

              <div id="appCamera" class="hidden w-full h-full flex flex-col justify-center items-center bg-black">
                <video id="smartphoneCameraFeed" class="w-full h-24 bg-zinc-900 rounded object-cover" autoplay playsinline muted></video>
              </div>

              <div id="appMercadoLivre" class="hidden w-full h-full p-1.5 bg-yellow-400 text-slate-900 flex flex-col justify-center rounded">
                <div class="flex items-center gap-1 mb-1 font-black text-[9px] uppercase">
                  <i class="fa-solid fa-bag-shopping"></i> Mercado Livre
                </div>
                <div class="bg-white p-1 rounded text-[8px] font-bold text-slate-800 flex justify-between items-center shadow-sm">
                  <span>Loja Virtual</span>
                  <span class="text-emerald-600 font-black">R$ 99,90</span>
                </div>
              </div>
            </div>

            <div class="flex justify-around items-center pt-1 border-t border-slate-800 bg-slate-900/80 rounded-b-lg">
              <button onclick="switchSmartphoneApp('youtube');" class="text-red-500 hover:scale-110 transition-transform"><i class="fa-brands fa-youtube text-xs"></i></button>
              <button onclick="switchSmartphoneApp('camera');" class="text-blue-400 hover:scale-110 transition-transform"><i class="fa-solid fa-camera text-xs"></i></button>
              <button onclick="switchSmartphoneApp('ml');" class="text-yellow-400 hover:scale-110 transition-transform"><i class="fa-solid fa-cart-shopping text-xs"></i></button>
              <button onclick="confirmAndOpenMaps();" class="text-emerald-400 hover:scale-110 transition-transform"><i class="fa-solid fa-map-location-dot text-xs"></i></button>
            </div>
          </div>
        ` : '';

        let onlineBankHTML = block.hasOnlineBank ? `
          <div class="nubank-container w-full my-auto flex flex-col gap-2 p-2.5 bg-[#8A19D6] text-white rounded-xl shadow-xl border border-purple-400/20" onclick="event.stopPropagation();">
            <div class="flex justify-between items-center">
              <div class="flex items-center gap-1.5">
                <div class="w-6 h-6 rounded-full bg-white/20 flex items-center justify-center">
                  <i class="fa-solid fa-user text-xs text-white"></i>
                </div>
                <span class="text-xs font-bold tracking-tight">Olá, Usuário</span>
              </div>
              <button onclick="toggleBalanceVisibility();" class="w-6 h-6 rounded-full hover:bg-white/10 flex items-center justify-center transition-colors">
                <i id="bankEyeIcon" class="fa-solid fa-eye text-white text-xs"></i>
              </button>
            </div>

            <div class="bg-white text-slate-900 p-2 rounded-lg shadow-inner">
              <div class="flex justify-between items-center mb-0.5">
                <span class="text-[9px] font-bold text-slate-500 uppercase">Conta</span>
                <i class="fa-solid fa-chevron-right text-[8px] text-slate-400"></i>
              </div>
              <span id="bankBalanceDisplay" class="text-base font-black tracking-tight text-slate-900 block">
                R$ 2.450,80
              </span>
            </div>

            <div class="flex justify-start">
              <button onclick="sendPixTransfer();" class="flex flex-col items-center gap-1 group">
                <div class="w-9 h-9 rounded-full bg-white/15 group-hover:bg-white/25 flex items-center justify-center transition-all shadow active:scale-95">
                  <svg class="w-4 h-4 fill-white" viewBox="0 0 512 512">
                    <path d="M112.5 108.3c-12 0-23.3 4.7-31.8 13.2L13.2 189c-17.6 17.6-17.6 46.1 0 63.7l67.5 67.5c8.5 8.5 19.8 13.2 31.8 13.2h67.4l-35.8-35.8c-12.5-12.5-12.5-32.8 0-45.3l85.2-85.2c12.5-12.5 32.8-12.5 45.3 0l85.2 85.2c12.5 12.5 12.5 32.8 0 45.3l-35.8 35.8h67.4c12 0 23.3-4.7 31.8-13.2l67.5-67.5c17.6-17.6 17.6-46.1 0-63.7l-67.5-67.5c-8.5-8.5-19.8-13.2-31.8-13.2H112.5zM399.5 403.7c12 0 23.3-4.7 31.8-13.2l67.5-67.5c17.6-17.6 17.6-46.1 0-63.7l-67.5-67.5c-8.5-8.5-19.8-13.2-31.8-13.2h-67.4l35.8 35.8c12.5 12.5 12.5 32.8 0 45.3l-85.2 85.2c-12.5 12.5-32.8 12.5-45.3 0l-85.2-85.2c-12.5-12.5-12.5-32.8 0-45.3l35.8-35.8h-67.4c-12 0-23.3 4.7-31.8 13.2L32.2 258.8c-17.6 17.6-17.6 46.1 0 63.7l67.5 67.5c8.5 8.5 19.8 13.2 31.8 13.2h268z"/>
                  </svg>
                </div>
                <span class="text-[9px] font-bold text-white">Área Pix</span>
              </button>
            </div>
          </div>
        ` : '';

        let aiSymbolsHTML = block.hasAiSymbols ? `
          <div class="ai-symbols-container w-full my-auto flex flex-col gap-2 p-2.5 bg-slate-900 rounded-xl border border-slate-700 shadow-xl" onclick="event.stopPropagation();">
            <div class="text-[9px] font-extrabold text-cyan-400 uppercase tracking-wider text-center mb-0.5">
              Plataformas Principais
            </div>

            <a href="https://chatgpt.com" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2.5 p-1.5 bg-[#10a37f]/10 border border-[#10a37f]/40 hover:border-[#10a37f] rounded-lg transition-all group">
              <div class="w-6 h-6 rounded bg-[#10a37f] flex items-center justify-center p-1 shadow shrink-0">
                <svg class="w-full h-full fill-white" viewBox="0 0 24 24">
                  <path d="M22.28 10.15a5.98 5.98 0 0 0-.52-4.81 6.05 6.05 0 0 0-6.54-2.83A6.02 6.02 0 0 0 10.8 1A6.05 6.05 0 0 0 5 4.88a6.02 6.02 0 0 0-4.1 3.1 6.05 6.05 0 0 0 .88 7.1 5.98 5.98 0 0 0 .52 4.81 6.05 6.05 0 0 0 6.54 2.83A6.02 6.02 0 0 0 13.2 23a6.05 6.05 0 0 0 5.8-3.88 6.02 6.02 0 0 0 4.1-3.1 6.05 6.05 0 0 0-.82-5.87zM13.2 21.5a4.49 4.49 0 0 1-2.83-1l.15-.08 4.7-2.71a.76.76 0 0 0 .38-.66v-6.6l1.98 1.15a.07.07 0 0 1 .04.05v5.38a4.52 4.52 0 0 1-4.42 4.47zM3.88 17.8a4.5 4.5 0 0 1-.54-2.98l.15.09 4.7 2.71a.76.76 0 0 0 .76 0l5.72-3.3v2.3a.08.08 0 0 1-.03.06l-4.66 2.69a4.52 4.52 0 0 1-6.1-1.57zm-1.38-9.4A4.5 4.5 0 0 1 4.8 6.1l-.01.17v5.42a.76.76 0 0 0 .38.66l5.72 3.3-1.98 1.15a.08.08 0 0 1-.07 0L4.18 14.1a4.52 4.52 0 0 1-1.68-5.7zm15.17-2.31 1.98 1.15a.08.08 0 0 1 .04.05v5.42a4.5 4.5 0 0 1-6.72 3.9l-.15-.09-4.7-2.71a.76.76 0 0 0-.76 0l-5.72 3.3V11.2a.08.08 0 0 1 .03-.06l4.66-2.69a4.5 4.5 0 0 1 6.2 1.45l5.22 3.01zM10.8 2.5a4.49 4.49 0 0 1 2.83 1l-.15.08-4.7 2.71a.76.76 0 0 0-.38.66v6.6l-1.98-1.15a.07.07 0 0 1-.04-.05V7.02a4.52 4.52 0 0 1 4.42-4.52zm8.13 4.88a4.5 4.5 0 0 1 .54 2.98l-.15-.09-4.7-2.71a.76.76 0 0 0-.76 0l-5.72 3.3v-2.3a.08.08 0 0 1 .03-.06l4.66-2.69a4.52 4.52 0 0 1 6.1 1.57z"/>
                </svg>
              </div>
              <div class="flex flex-col">
                <span class="text-[10px] font-black text-white leading-none">ChatGPT</span>
                <span class="text-[8px] text-slate-400">OpenAI</span>
              </div>
            </a>

            <a href="https://gemini.google.com" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2.5 p-1.5 bg-blue-950/60 border border-blue-500/40 hover:border-blue-400 rounded-lg transition-all group">
              <div class="w-6 h-6 rounded bg-gradient-to-br from-blue-500 via-indigo-500 to-purple-600 flex items-center justify-center p-1 shadow shrink-0">
                <svg class="w-full h-full fill-white" viewBox="0 0 24 24">
                  <path d="M12 0C12 6.627 6.627 12 0 12c6.627 0 12 5.373 12 12 0-6.627 5.373-12 12-12-6.627 0-12-5.373-12-12z"/>
                </svg>
              </div>
              <div class="flex flex-col">
                <span class="text-[10px] font-black text-white leading-none">Gemini</span>
                <span class="text-[8px] text-slate-400">Google</span>
              </div>
            </a>

            <a href="https://www.meta.ai" target="_blank" rel="noopener noreferrer" class="flex items-center gap-2.5 p-1.5 bg-sky-950/60 border border-sky-500/40 hover:border-sky-400 rounded-lg transition-all group">
              <div class="w-6 h-6 rounded bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center p-1 shadow shrink-0">
                <svg class="w-full h-full fill-white" viewBox="0 0 24 24">
                  <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 16a6 6 0 1 1 6-6 6 6 0 0 1-6 6z"/>
                </svg>
              </div>
              <div class="flex flex-col">
                <span class="text-[10px] font-black text-white leading-none">Meta AI</span>
                <span class="text-[8px] text-slate-400">Meta</span>
              </div>
            </a>
          </div>
        ` : '';

        let defaultVideoLinkHTML = !block.hasSmartphone ? `
          <a href="${block.youtubeUrl}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation();" class="btn-video-link">
            <i class="fa-brands fa-youtube text-lg text-red-500"></i>
            <span>Assistir Vídeo</span>
          </a>
        ` : '';

        card.innerHTML = `
          <div class="card-inner-text text-center mb-1">
            <span class="text-[11px] font-black uppercase tracking-widest opacity-80 block">
              Época ${block.num}
            </span>
            <span class="text-xs font-bold opacity-90 block">
              ${block.periodo}
            </span>
          </div>

          ${switchHTML}
          ${typewriterHTML}
          ${whatsAppHTML}
          ${googleSearchHTML}
          ${smartphoneHTML}
          ${onlineBankHTML}
          ${aiSymbolsHTML}
          ${defaultVideoLinkHTML}
        `;

        card.addEventListener('click', () => {
          if (currentIndex !== index) {
            currentIndex = index;
            updateCarousel();
          }
        });

        stage.appendChild(card);
      });

      updateCarousel();
    }

    function updateCarousel() {
      endPhoneCall();
      stopCameraStream();
      const cards = document.querySelectorAll('.carousel-card');

      if (blocksData[currentIndex]) {
        epochTitle.textContent = blocksData[currentIndex].title;
        if (blocksData[currentIndex].imagem) {
          bgTimeline.style.backgroundImage = `url('${blocksData[currentIndex].imagem}')`;
        }
        bgTimeline.style.backgroundPosition = blocksData[currentIndex].bgPosition || "center center";
      }

      if (isLightOnPermanently) {
        document.body.classList.add('lamp-on');
      }

      cards.forEach((card, i) => {
        card.classList.remove('hide-side-card');

        let offset = i - currentIndex;
        const isMobile = window.innerWidth < 640;
        
        const translateX = offset * (isMobile ? 125 : 190);
        const translateZ = -Math.abs(offset) * (isMobile ? 95 : 140);
        const rotateY = -offset * (isMobile ? 12 : 18);
        const opacity = Math.max(0.3, 1 - Math.abs(offset) * 0.25);
        const scale = 1 - Math.abs(offset) * 0.05;

        card.style.transform = `
          translateX(${translateX}px) 
          translateZ(${translateZ}px) 
          rotateY(${rotateY}deg) 
          scale(${scale})
        `;
        card.style.opacity = opacity;
        card.style.zIndex = 100 - Math.abs(offset) * 10;

        if (i === currentIndex) {
          card.classList.add('active-card');
        } else {
          card.classList.remove('active-card');
        }
      });

      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        cards.forEach((card, i) => {
          if (i !== currentIndex) {
            card.classList.add('hide-side-card');
          }
        });
      }, 500);
    }

    document.addEventListener('keydown', (e) => {
      if (document.activeElement && (document.activeElement.tagName === 'TEXTAREA' || document.activeElement.tagName === 'INPUT')) return;

      if (e.key === 'ArrowRight') {
        currentIndex = (currentIndex < totalCards - 1) ? currentIndex + 1 : 0;
        updateCarousel();
      } else if (e.key === 'ArrowLeft') {
        currentIndex = (currentIndex > 0) ? currentIndex - 1 : totalCards - 1;
        updateCarousel();
      }
    });

    let startX = 0;
    let isDragging = false;

    stage.addEventListener('mousedown', (e) => { startX = e.clientX; isDragging = true; });
    stage.addEventListener('mouseup', (e) => {
      if (!isDragging) return;
      if (Math.abs(startX - e.clientX) > 40) {
        currentIndex = (startX - e.clientX > 0) ? (currentIndex + 1) % totalCards : (currentIndex - 1 + totalCards) % totalCards;
        updateCarousel();
      }
      isDragging = false;
    });

    stage.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; isDragging = true; });
    stage.addEventListener('touchend', (e) => {
      if (!isDragging) return;
      let touchX = e.changedTouches[0].clientX;
      if (Math.abs(startX - touchX) > 40) {
        currentIndex = (startX - touchX > 0) ? (currentIndex + 1) % totalCards : (currentIndex - 1 + totalCards) % totalCards;
        updateCarousel();
      }
      isDragging = false;
    });

    window.addEventListener('resize', updateCarousel);
    window.onload = renderCards;
  </script>
</body>
</html>
